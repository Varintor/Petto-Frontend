# apkzlib writes MS-DOS timestamps and cannot encode the Buddhist calendar
# year inherited from a th-TH Java locale. Keep build tooling on Gregorian
# dates; this does not change the locale used by the application at runtime.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Duser.language=en -Duser.country=US
android.useAndroidX=true
